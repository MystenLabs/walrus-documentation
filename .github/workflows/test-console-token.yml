# Temporary: checks CONSOLE_GITHUB_TOKEN can read MystenLabs/console releases.
# Opens no pull request. Remove before merging.
name: Test console token
on:
  pull_request:
    paths: [".github/workflows/test-console-token.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v7.0.0
        with:
          node-version: '20'
      - name: Coverage check (Console only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSOLE_GITHUB_TOKEN: ${{ secrets.CONSOLE_GITHUB_TOKEN }}
        run: cd site && node src/scripts/check-editorial-coverage.js --source console --strict
      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONSOLE_GITHUB_TOKEN: ${{ secrets.CONSOLE_GITHUB_TOKEN }}
        run: |
          cd site
          node src/scripts/generate-release-notes.js | tee "$RUNNER_TEMP/gen.log"
          grep -q "Found 4 Walrus Console releases" "$RUNNER_TEMP/gen.log"
      - name: Console page matches the committed one, with no links
        run: |
          git diff --exit-code content/walrus/release-notes/walrus-console.mdx
          ! grep -n "github.com/MystenLabs/console" content/walrus/release-notes/walrus-console.mdx site/src/data/changelog.json
